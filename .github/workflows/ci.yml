name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shim:
    name: shim (linux-x64)
    uses: ./.github/workflows/shim.yml
    with:
      platform: linux-x64
      runner: runs-on=${{ github.run_id }}/runner=shim-x64/extras=s3-cache

  # No shim: the ephor artifact is a standalone executable that never links
  # the engine module, and build.zig only treats the shim path as a string at
  # configure time.
  analysis:
    name: ephor + fmt
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/zig

      # ephor's ZA601 already runs `zig fmt --check` over src/; these are the
      # trees its path_dir does not reach, less the ephor sources and cache that
      # tools/ephor fetches.
      - name: zig fmt
        run: >-
          zig fmt --check build.zig entrypoints tools
          --exclude tools/ephor/zig-pkg --exclude tools/ephor/.zig-cache

      # ephor builds with the Zig that tools/ephor/build.zig.zon names, not this
      # project's, so its package runs directly rather than through `zig build ephor`.
      - uses: ./.github/actions/zig
        with:
          build-zig-zon: tools/ephor/build.zig.zon

      - name: ephor
        run: zig build --build-file tools/ephor/build.zig run -- --summary --fail-on=note

  # The one compile the jobs below share. Each of them links the same gRPC, abseil and
  # BoringSSL objects, about ten minutes of C++ on this runner, and a restored Zig cache does
  # not spare a second job that work: Zig rejects a cached C or C++ object once its source
  # file has a new inode (https://codeberg.org/ziglang/zig/issues/37200). So this job
  # compiles and the others receive binaries.
  #
  # zig-out holds tests/ (debug), bin/ (the release tree `dist` installs) and harness/.
  # The key is the commit, so re-running a failed job finds these binaries again.
  build:
    name: build (linux-x64)
    needs: shim
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - id: zig-out
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zig-out
          key: zig-out-linux-x64-${{ github.sha }}
      - if: steps.zig-out.outputs.cache-hit != 'true'
        uses: ./.github/actions/zig
      - name: zig build install-test
        if: steps.zig-out.outputs.cache-hit != 'true'
        run: zig build install-test -Dshim-dylib=${{ steps.shim.outputs.path }}
      - name: zig build dist install-harness
        if: steps.zig-out.outputs.cache-hit != 'true'
        run: >-
          zig build dist install-harness -Drelease=true
          -Dshim-dylib=${{ steps.shim.outputs.path }}
          -Dshim-static-obj=${{ steps.shim.outputs.static-path }}

  # The test binaries and harnesses below load the shim dylib from dist/shim, the path they
  # were linked against, so each job that runs them restores it.
  test:
    name: unit tests
    needs: build
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zig-out
          key: zig-out-linux-x64-${{ github.sha }}
          fail-on-cache-miss: true
      - run: ./zig-out/tests/engine-tests
      - run: ./zig-out/tests/server-tests

  spec:
    name: spec (googlesqlite + go-zetasqlite)
    needs: build
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zig-out
          key: zig-out-linux-x64-${{ github.sha }}
          fail-on-cache-miss: true

      # --strict is what makes this a real gate: without it the runner exits
      # nonzero only on a baseline regression, so a case that has never passed
      # can start returning wrong answers and still go green.
      - name: spec-runner --strict
        run: |
          set -euo pipefail
          ./zig-out/harness/spec-runner --strict | tee spec.log

      # Reuses the run above rather than invoking --markdown, which would
      # replay all cases a second time for a per-category table.
      - name: summary
        if: always()
        run: |
          { echo '## Spec'; echo; echo '```'; head -20 spec.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  # Not benchmarks: every harness here carries a positive control (GENERATE_UUID
  # uniqueness; per-connection catalogs that MUST fail; a gRPC status that must
  # come from our handler rather than the transport) and exits nonzero when the
  # control does not behave, so a broken build cannot quietly pass them.
  concurrency-harness:
    name: concurrency harnesses
    needs: build
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zig-out
          key: zig-out-linux-x64-${{ github.sha }}
          fail-on-cache-miss: true
      - run: ./zig-out/harness/analyzer-threads
      - run: ./zig-out/harness/shared-catalog-threads
      # Same contract: the Storage Read transport answers UNIMPLEMENTED, and
      # three controls (an unknown service must reach our handler too, a second
      # call on one channel must be answered, and the listener must be gone
      # after stop()) mean a build that merely links cannot pass. It binds port
      # 0, so it cannot collide with anything else on the runner.
      - run: ./zig-out/harness/grpc-smoke

  # The Python client suite ported from Recidiviz/bigquery-emulator, run the
  # way downstream fixtures consume the emulator: testcontainers against the
  # Docker image, built here from the same static `dist` binaries a release
  # ships. No other job builds the image before a tag, so this is also what
  # catches a Dockerfile or ENTRYPOINT that no longer starts.
  python-integration:
    name: python integration (Docker image)
    needs: build
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zig-out
          key: zig-out-linux-x64-${{ github.sha }}
          fail-on-cache-miss: true

      # Staged outside the checkout: the Dockerfile copies dist/bin/, and a
      # context rooted at the repo would carry the whole tree to the daemon.
      - name: build image
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/image"
          mkdir -p "$ctx/dist"
          cp -r zig-out/bin "$ctx/dist/bin"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES "$ctx/dist/"
          docker build -f Dockerfile -t zigquery-emulator:ci "$ctx"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          working-directory: test/python
          enable-cache: true
          cache-dependency-glob: test/python/uv.lock

      - name: pytest
        working-directory: test/python
        env:
          BIGQUERY_EMULATOR_REPOSITORY: zigquery-emulator
          BIGQUERY_EMULATOR_VERSION: ci
        run: |
          uv sync --locked
          uv run pytest -n 4 -v -rxX

  # The @google-cloud/bigquery suite in test/node, against an image built the same way as
  # python-integration's. It covers the client paths downstream Node services take.
  node-integration:
    name: node integration (Docker image)
    needs: build
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: zig-out
          key: zig-out-linux-x64-${{ github.sha }}
          fail-on-cache-miss: true

      - name: build image
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/image"
          mkdir -p "$ctx/dist"
          cp -r zig-out/bin "$ctx/dist/bin"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES "$ctx/dist/"
          docker build -f Dockerfile -t zigquery-emulator:ci "$ctx"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/node/package-lock.json

      - name: npm test
        working-directory: test/node
        env:
          BIGQUERY_EMULATOR_REPOSITORY: zigquery-emulator
          BIGQUERY_EMULATOR_VERSION: ci
        run: |
          npm ci --ignore-scripts
          npm test

  # Both generated codecs come from committed .fdsets and are easy to forget
  # when one of them moves. gen-proto is a host tool that does not link the
  # engine, so no shim.
  gen-proto-drift:
    name: gen-proto drift
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/zig
      - run: zig build gen-proto
      - name: check for drift
        run: |
          for f in src/proto/resolved_ast.zig src/server/proto/storage.zig; do
            if ! git diff --exit-code -- "$f"; then
              echo "::error::$f is stale — run 'zig build gen-proto'"
              exit 1
            fi
          done

  # Cross-arch breakage is cheap to catch here and expensive to discover at
  # tag time. Push-only: it needs its own arm64 shim, which is a second cold
  # bazel build the first time the submodule moves.
  shim-arm64:
    name: shim (linux-arm64)
    if: github.event_name == 'push'
    uses: ./.github/workflows/shim.yml
    with:
      platform: linux-arm64
      runner: runs-on=${{ github.run_id }}/runner=shim-arm64/extras=s3-cache

  build-arm64:
    name: build (linux-arm64)
    if: github.event_name == 'push'
    needs: shim-arm64
    runs-on: runs-on=${{ github.run_id }}/runner=zig-arm64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-arm64
      - uses: ./.github/actions/zig
      - run: >-
          zig build dist -Drelease=true
          -Dshim-dylib=${{ steps.shim.outputs.path }}
          -Dshim-static-obj=${{ steps.shim.outputs.static-path }}
