name: zig
description: >
  Install Zig and make its global cache usable for .zip dependencies.

inputs:
  build-zig-zon:
    description: The build.zig.zon whose minimum_zig_version names the Zig to install
    required: false
    default: build.zig.zon
  cache-size-limit:
    # A release build of the server leaves 3.3-3.8 GB in .zig-cache. When the
    # directory exceeds this limit setup-zig saves an empty cache, and every
    # later run compiles from scratch.
    description: Largest Zig cache directory, in MiB, that setup-zig will save
    required: false
    default: "6144"

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      env:
        ZON: ${{ inputs.build-zig-zon }}
      run: |
        set -euo pipefail
        version=$(sed -n 's/^[[:space:]]*\.minimum_zig_version = "\(.*\)",.*$/\1/p' "$ZON")
        if [ -z "$version" ]; then
          echo "::error::no minimum_zig_version in $ZON"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "zig $version from $ZON"

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: ${{ steps.version.outputs.version }}
        cache-size-limit: ${{ inputs.cache-size-limit }}

    # Zig 0.16 stages a .zip dependency through <global-cache>/tmp but does
    # not create that directory, so on a cache that has never held one the
    # fetch dies with "failed to create temporary zip file: FileNotFound".
    # Only the sqlite amalgamation is affected — the .tar.gz deps stream
    # straight out and never touch tmp/, which is why this shows up as one
    # dependency failing rather than the whole fetch.
    #
    # The path comes from `zig env` rather than $ZIG_GLOBAL_CACHE_DIR, which
    # setup-zig does not necessarily export.
    - shell: bash
      run: |
        set -euo pipefail
        cache=$(zig env | sed -n 's/^[[:space:]]*\.global_cache_dir = "\(.*\)",$/\1/p')
        if [ -z "$cache" ]; then
          echo "::error::could not determine zig global cache dir from 'zig env'"
          exit 1
        fi
        mkdir -p "$cache/tmp"
        echo "zig global cache: $cache"
